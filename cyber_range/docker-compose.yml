services:
  webapp:
    image: docker.io/bkimminich/juice-shop:v14.0.0
    container_name: webapp
    ports:
      - "8080:3000"
    networks:
      - range_net

  database:
    image: docker.io/library/mysql:5.7.31
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: appdb
    networks:
      - range_net

  employee:
    build:
      context: .
      dockerfile: machines/employee.Dockerfile
    container_name: employee
    command: sleep infinity
    networks:
      - range_net

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    depends_on:
      - webapp
    volumes:
      - ../experiments/results:/zap/wrk:z
    networks:
      - range_net

  caldera:
    image: ${CALDERA_IMAGE:-ghcr.io/mitre/caldera:latest}
    container_name: caldera
    profiles:
      - caldera
    ports:
      - "8888:8888"
    networks:
      - range_net

  dashboard:
    image: docker.io/library/python:3.12-slim
    container_name: aegis-dashboard
    working_dir: /app
    command: python backend/aegis_dashboard.py
    environment:
      AEGIS_HOST: 0.0.0.0
      AEGIS_PORT: 8000
      AEGIS_RESULTS_DIR: /app/experiments/results
      AEGIS_SCENARIOS_DIR: /app/experiments/scenarios
      AEGIS_FRONTEND_DIR: /app/frontend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend:ro,z
      - ../frontend:/app/frontend:ro,z
      - ../experiments:/app/experiments:ro,z
    networks:
      - range_net

networks:
  range_net:
    driver: bridge
